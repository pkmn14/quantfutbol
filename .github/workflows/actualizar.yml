name: Actualizar Partidos QuantFutbol

on:
  schedule:
    # 10:00 UTC = 06:00 AM hora de Bolivia
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar recolector de APIs
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python recolector.py

      - name: Guardar partidos_hoy.json actualizado
        run: |
          git config user.name "QuantFutbol Bot"
          git config user.email "bot@quantfutbol.local"
          git add partidos_hoy.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de partidos" && git push)
